[tool.poetry]
name = "dpypelines"
version = "0.1.0"
description = "Data ingest pipelines for ONS Digital Publishing"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
include = ["dpypelines/schemas/**/*.json"]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.12.0"
pandas = "^2.2.1"
unidecode = "^1.3.8"
xmltodict = "^0.13.0"
dpytools = { git = "https://github.com/ONSdigital/dp-python-tools.git", tag = "v0.6.0" }
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
black = "^24.2.0"
isort = "^5.13.2"
ruff = "^0.3.0"
pytest-cov = "^4.1.0"
behave = "^1.2.6"
docker = "^7.0.0"
dictdiffer = "0.9.0"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
include = '\.pyi?$'
extend-exclude = '''
(
    .*\.zip
    | .*\.md
    | features/
    | docs/
)
'''

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff]
exclude = [
    "features/",
    ".md",
    ".zip"
]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.branches]
release = { match = "release/*", prerelease = true, prerelease_token = "wip",  changelog_file = "CHANGELOG.md",  commit = false }
testing = { match = "testing/*", prerelease = true, prerelease_token = "wip",  changelog_file = "CHANGELOG.md",  commit = false }

[semantic_release]
tag_format = "v{version}"
version_toml = [
    "pyproject.toml:tool.poetry.version",
]
version_variables = [
    "Makefile:version:tf"
]