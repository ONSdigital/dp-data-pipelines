name: Build and tag release

on:
  pull_request:
    branches:
      - sandbox
      - staging
      - production
  workflow_dispatch: 

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  release:
   # if: startsWith(github.head_ref || github.ref_name, 'release')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      checks: write
      statuses: write
    outputs:
      version: ${{ steps.release.outputs.tag }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        
      - name: Action | Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: "false"

      - name: Create Verified Release Commit
        if: steps.release.outputs.released == 'true'
        run: |
          echo "Release ${{ steps.release.outputs.tag }}" > RELEASE.md
          
          # Use GraphQL API for verified commit
          gh api graphql \
            -F githubRepository=$GITHUB_REPOSITORY \
            -F branchName=$BRANCH \
            -F expectedHeadOid=$(git rev-parse HEAD) \
            -F commitMessage="chore: release ${{ steps.release.outputs.tag }}" \
            -F files[][path]="RELEASE.md" -F files[][contents]=$(base64 -w0 RELEASE.md) \
            -F 'query=@.github/api/createCommitOnBranch.gql'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish | Upload to GitHub Release Assets
        uses: python-semantic-release/publish-action@v9.21.0
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}