# Description:
#   This workflow will automatically increments the version (patch/minor/major) using Poetry,
#   tag the commit with the new version, builds the Python wheel and creates a GitHub release.


name: Release on Merge to Sandbox

on:
  push:
    branches:
      - sandbox
  workflow_dispatch:
    inputs:
      increment_type:
        description: 'Version increment type (patch, minor, major)'
        required: false
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Determine version increment type
        id: increment_type
        run: |
          echo "INCREMENT_TYPE=${{ github.event.inputs.increment_type || 'patch' }}" >> $GITHUB_ENV

      - name: Increment version
        id: version
        run: |
          poetry version ${{ env.INCREMENT_TYPE }}
          echo "version=$(poetry version -s)" >> $GITHUB_ENV

      - name: Tag commit with new version
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git tag v${{ env.version }}
          git push origin --tags

      - name: Build wheel
        run: poetry build

      - name: Create GitHub Release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.version }}
          release_name: Release v${{ env.version }}
          draft: false
          prerelease: false
          files: dist/*.whl