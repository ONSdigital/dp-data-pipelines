                await setBranchToCommit(org, repo, branch, newCommit.sha)

              // Create the release
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `Release ${tag}`,
                body: 'Automated release by GitHub Actions',
                draft: false,
