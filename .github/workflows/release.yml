name: Build and tag release

on:
  pull_request:
    branches:
      - sandbox
      - staging
      - production
  workflow_dispatch: 
    inputs:
      sourceBranch:
        description: 'What branch to start release from'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - sandbox
          - staging
          - debug

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:

  release:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      checks: write
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        
      - name: Action | Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: "false"
          tag: "false"
      
      - name: Create GitHub Release and Tag
        if: steps.release.outputs.released == 'true'
        uses: actions/github-script@v6
        env:
          TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const script = require('./.github/workflows/release-script.js')
            await script({github, context, core});

      - name: Get changelog
        if: steps.release.outputs.released == 'true'
        uses: actions/github-script@v6
        id: get-changelog
        with:
          result-encoding: string
          script: |
            const script = require('./.github/workflows/release/changelog-parser.js')
            return await script({github, context, core});

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        if: steps.release.outputs.released == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Release ${{ steps.release.outputs.tag }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: release/${{ steps.release.outputs.tag }}
          title: 'Release ${{ steps.release.outputs.tag }}'
          body: ${{ steps.get-changelog.outputs.result }}
          draft: false
          sign-commits: true