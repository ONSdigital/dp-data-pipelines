# Description:
#   This workflow uses python-semantic-release to fully automate semantic versioning.
#   Based on commit messages it determines version bumps (patch/minor/major),
#   updates the changelog and version number, tags the commit, builds the wheel and creates a GitHub release.

name: Release on Merge to Sandbox

on:
  push:
    branches:
      - sandbox
  pull_request:
    branches:
      - sandbox
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/sandbox'
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force Branch to Latest Commit
        run: |
          git reset --hard ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install poetry python-semantic-release
          poetry install

      - name: Bump Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version --no-ci --yes

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release publish --yes

      - name: Build wheel
        run: poetry build