name: Build and tag release

on:
  pull_request:
    branches:
      - sandbox
      - staging
      - production
  workflow_dispatch: 

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  release:
   # if: startsWith(github.head_ref || github.ref_name, 'release')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      checks: write
      statuses: write
    outputs:
      version: ${{ steps.release.outputs.tag }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        
      - name: Action | Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: "false"


      - name: Create GitHub Release and Tag
        if: steps.release.outputs.released == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
              const { owner, repo } = context.repo;
              const tag = '${{ steps.release.outputs.tag }}';
              
              const createBlobForFile = (org, repo) => async (filePath) => {
                const content = await getFileAsUTF8(filePath)
                const blobData = await github.rest.git.createBlob({
                    owner: org,
                    repo,
                    content,
                    encoding: 'utf-8',
                })
                return blobData.data
              }

              const createNewTree = async (owner, repo, blobs, paths, parentTreeSha) => {
                  const tree = blobs.map(({ sha }, index) => ({
                      path: paths[index],
                      mode: `100644`,
                      type: `blob`,
                      sha,
                  }))
                  const { data } = await github.rest.git.createTree({
                      owner,
                      repo,
                      tree,
                      base_tree: parentTreeSha,
                  })
                  return data
              }

              const createNewCommit = async (org, repo, message, currentTreeSha, currentCommitSha) =>
                  (await github.rest.git.createCommit({
                      owner: org,
                      repo,
                      message,
                      tree: currentTreeSha,
                      parents: [currentCommitSha],
                  })).data

              console.log(createNewCommit);
              const setBranchToCommit = (org, repo, branch, commitSha) =>
                  github.rest.git.updateRef({
                      owner: org,
                      repo,
                      ref: `heads/${branch}`,
                      sha: commitSha,
                  })

              // Get the latest commit SHA (which should be our verified commit)
              const { data: refData } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${process.env.BRANCH}`
              });
              const latestCommitSha = refData.object.sha;
