# Description:
#   This workflow uses python-semantic-release to fully automate semantic versioning.
#   Based on commit messages it determines version bumps (patch/minor/major),
#   updates the changelog and version number, tags the commit, builds the wheel and creates a GitHub release.

name: Release on Merge to Sandbox

on:
  push:
    branches:
      - sandbox
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install poetry python-semantic-release
          poetry install

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Publish uses your commit messages to determine version bump automatically, 
          # updates your changelog, tags the commit & pushes the tag.
          semantic-release publish --yes

      - name: Build wheel
        run: poetry build

      - name: Create GitHub Release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v$(semantic-release version)
          release_name: Release v$(semantic-release version)
          draft: false
          prerelease: false
          files: dist/*.whl